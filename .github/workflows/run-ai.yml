name: Quant Engine AI

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install -r requirements.txt

      - name: AI Modelini Çalıştır (HMM & Korelasyon)
        run: |
          python quant_worker.py

      - name: Sonuçları (pool_data.json) GitHub'a Kaydet
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add pool_data.json
          git commit -m "Otomatik AI Güncellemesi: Piyasa Rejimi ve Havuz Skorları" || echo "Değişiklik yok"
          git push
